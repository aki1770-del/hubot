# ⚑ A DELIBERATELY BROKEN OVERLAY. IT EXISTS TO MAKE THE RUN FAIL.
#
# `run_live_stack.sh` exits 0 when the stack came up and non-zero when it did not.
# That promise is worth nothing unless something proves the non-zero half still
# happens, so this overlay names a controller plugin that does not exist and the
# CI job requires the script to REFUSE.
#
# ⚑ IT IS NOT A HYPOTHETICAL FAILURE MODE. This is exactly how the harness failed
# on released nav2 on 2026-09-07, when `config/live_stack.yaml` named
# `nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController` and
# `package.xml` did not declare the package that provides it:
#
#   [FATAL] [controller_server]: Failed to create controller. Exception: According
#   to the loaded plugin descriptions the class ... with base class type
#   nav2_core::Controller does not exist. Declared types are
#
# The costmap and the filter had already come up when that fired, which is why the
# earlier version of this script -- which exited 0 regardless -- reported a healthy
# run three times in a row over a stack that never activated.
#
# ⚑ DO NOT APPLY THIS OVERLAY TO A REAL RUN. It is a control, not a condition.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "hubot_live_stack::NoSuchControllerDeliberately"
