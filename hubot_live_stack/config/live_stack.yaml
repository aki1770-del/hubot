# hubot_live_stack — parameters for the REAL nav2 controller_server.
#
# controller_server creates its costmap as
#   Costmap2DROS("local_costmap", get_namespace(), use_sim_time, options)
#     (controller_server.cpp:49-51)
# and hands it to a nav2::NodeThread at controller_server.cpp:72, which is the
# production topology this harness exists to stand up. Costmap2DROS::on_activate
# then spawns map_update_thread_ at costmap_2d_ros.cpp:314 -- the thread that
# drives updateCosts() on our filter with no test thread involved.
#
# Hence the doubled key below: node name `local_costmap` in namespace
# `/local_costmap`.
#
# ⚑ TWO THINGS IN THIS FILE ARE LOAD-BEARING AND WERE BOTH LEARNED BY RUNNING IT.
#
# 1. NO EMPTY LISTS. `progress_checker_plugins: []` does not mean "no progress
#    checkers"; a YAML empty sequence carries no element type, so rcl builds a
#    parameter with no value and rclcpp throws while CONSTRUCTING the node:
#      InvalidParameterValueException: parameter_value_from failed for parameter
#      'progress_checker_plugins': ... Contains no value
#    The process aborts in ControllerServer::ControllerServer, before
#    on_configure, before the costmap thread exists. Omit the key instead --
#    nav2 then applies its own defaults AND auto-declares the matching
#    `.plugin` types (parameter_handler.cpp:60-101).
#
# 2. `plugins:` MUST NOT BE EMPTY EITHER, and not only for the reason above.
#    CostmapFilter::updateBounds() ignores its bounds arguments, so if no
#    PLUGIN declares a window, LayeredCostmap::updateMap() computes x0=9, xn=1
#    and the `if (xn >= x0 && yn >= y0)` guard around every
#    `(*filter)->updateCosts(...)` is never satisfied. The stack would come up,
#    spin at 5 Hz, publish a costmap, and drive the filter ZERO times while
#    looking healthy.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    # progress_checker_plugins / goal_checker_plugins / controller_plugins /
    # path_handler_plugins are DELIBERATELY ABSENT -- see note 1 above, so nav2
    # auto-declares its own names and creates SimpleProgressChecker,
    # SimpleGoalChecker and FeasiblePathHandler, all of which ship inside
    # nav2_controller itself. Observed doing exactly that on released nav2 1.5.1,
    # 2026-09-07. The controller's own control loop is not the subject; the
    # costmap node thread controller_server.cpp:72 creates is, and that is
    # created before any of them.
    FollowPath:
      # ⚑ THIS LINE IS A DEPENDENCY, AND FOR A WHILE NOTHING SAID SO.
      # The regulated pure pursuit controller lives in its OWN package. It is
      # named here rather than left to nav2's default because MPPI would burn CPU
      # optimising trajectories nothing in this harness asks for -- but naming it
      # obliges package.xml to declare it, and package.xml did not. On an image
      # where all of nav2 was built from source it resolved by accident; on
      # released nav2 it is a separate deb and controller_server dies at
      # configure without it. `<exec_depend>nav2_regulated_pure_pursuit_controller
      # </exec_depend>` is what keeps this line honest. If you change the plugin,
      # change the manifest in the same edit.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 1.0
      robot_radius: 0.22
      transform_tolerance: 1.0
      # The bounds-declaring layer -- see note 2 above. Loaded by the real
      # Costmap2DROS through pluginlib, not appended by a fixture. It writes no
      # costs, so every observed effect stays attributable to the filter.
      plugins: ["bounds_layer"]
      bounds_layer:
        plugin: "hubot_live_stack::FullWindowBoundsLayer"
        enabled: true
      # THE FILTER, loaded by Costmap2DROS through pluginlib exactly as
      # costmap_2d_ros.cpp:184-200 does. Not a fixture calling initialize().
      filters: ["zone_parameter_filter"]
      zone_parameter_filter:
        plugin: "hubot::ZoneParameterFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 0.5
        # Short so the harness observes a deadline without a long wall clock;
        # raise to hubot's 5.0 default when timing itself is the subject.
        set_parameters_timeout: 3.0
        liveness_period: 0.5
        costmap_silence_timeout: 2.0
        states: ["danger_zone"]
        danger_zone:
          id: 1
          # hubot reads `<state>.setpoints` (loadStateConfig); upstream names
          # the same list `overrides`.
          setpoints: ["ro_speed"]
          ro_speed:
            # A node in ANOTHER OS PROCESS. rclcpp::AsyncParametersClient
            # (zone_parameter_filter.cpp:387) makes this a real
            # `<target>/set_parameters` round trip over the middleware.
            # ⚑ ABSOLUTE, WITH THE LEADING SLASH, AND THAT IS LOAD-BEARING.
            # rclcpp::AsyncParametersClient resolves this name RELATIVE to the
            # owning node. The owning node here is the real costmap node
            # `/local_costmap/local_costmap`, so a bare `zpf_target_node`
            # builds a client for
            #     /local_costmap/zpf_target_node/set_parameters
            # which does not exist. Measured 2026-09-06 on this harness, with a
            # two-sided control:
            #   relative  -> `ros2 node info` shows the client on the WRONG
            #                path; the target process logs NOTHING; the filter
            #                reports enforced:NO only after its 3.0s deadline.
            #   absolute  -> the target process logs the set arriving; the
            #                filter reports enforced:pending then enforced:yes.
            # Every in-process hubot fixture hosts its target on a node at ROOT
            # namespace, where a relative name happens to resolve correctly --
            # so this class cannot appear there, and did not.
            # `config/overlay_target_relative_name.yaml` reproduces it on purpose.
            node: "/zpf_target_node"
            # Declared read_only by that process, so the refusal is rclcpp's
            # own and not a callback imitating one.
            parameter: "readonly_speed"
            value: 0.5
