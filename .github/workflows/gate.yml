# ══════════════════════════════════════════════════════════════════════════════
# hubot — the gate a contributor gets for free.
#
# WHY THIS FILE EXISTS. Until it did, every green result this package had ever
# produced happened because someone on the maintaining side chose to run it by
# hand. That put "is this right?" on the person opening the pull request, or on
# us reading it afterwards. It is the machine's job. The stranger who opens the
# first PR against this package should learn what she broke from the run, before
# anyone here has looked at it.
#
# WHAT IT RUNS: the same things that were being run by hand — the full CTest
# suite against RELEASED nav2, the prose-and-tree gate, the static safety
# invariants, and the launch-side bring-up falsifier.
#
# ⚑ AND IT RUNS THE GATES' OWN NEGATIVE CONTROLS ON EVERY PULL REQUEST.
# A gate that has never failed has measured nothing, so `controls` proves — on
# your PR, not on some past afternoon — that each check can still go red.
# ══════════════════════════════════════════════════════════════════════════════
name: gate

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege. Nothing here writes to the repository, and nothing here needs
# a secret — see the `secrets` note in the substrate step.
permissions:
  contents: read

# A newer push supersedes an older run on the same ref. The contributor waits for
# her latest commit, not for a queue behind it.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ⚑ THE SUBSTRATE, PINNED BY DIGEST. ubuntu:26.04 == "resolute", the distribution
  # the released ROS "lyrical" nav2 debs are built for. A tag can move; a digest
  # cannot, and a build whose base moved silently is not a reproduction.
  BASE_IMAGE: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
  # The codename that digest actually IS, named once so the three jobs below pass
  # the same value to the substrate action instead of each typing "resolute".
  # ⚑ The digest itself is still spelled out in every `container:` block, and that
  # IS a second copy of a fact -- `jobs.<id>.container.image` cannot read the `env`
  # context, so the duplication is GitHub's rather than a choice. It is named here
  # instead of left to be discovered. The `distro floor` job below carries no such
  # copy: its image comes from the matrix, which comes from supported_distros.yml.
  BASE_CODENAME: resolute

jobs:
  # ── 1 ── the suite: build against RELEASED nav2 and run all ten CTest targets
  suite:
    name: suite (released nav2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      # ⚑ NO `options: --init` HERE, AND THE OMISSION IS THE RULING.
      # The first CI run's launch job refused before its first case, over three zombies
      # (2x map_server, 1x nav2_costmap_2d, all <defunct>) left un-reaped because a
      # container whose PID 1 is a shell reaps no orphans. Three fixes were possible:
      #   `--init`      -- gives PID 1 a reaper. Removes the zombies, but it is a property
      #                    of HOW THE CONTAINER WAS STARTED. test/launch_gate.sh has to be
      #                    right when a contributor runs it on her laptop with no container
      #                    at all, so this cannot be the fix; at best it hides the bug here
      #                    while leaving it live for her.
      #   teardown wait -- CANNOT WORK. A process may only wait() for its own children.
      #                    The zombies are the launch file's children, reparented to PID 1
      #                    when their parent died. They were never ours to reap.
      #   the predicate -- the guard asks the wrong question. A defunct process holds no
      #                    sockets and joins no DDS graph; it cannot contaminate the count
      #                    the guard protects. Narrowed to LIVE processes, with a control
      #                    in each direction (a live survivor still refuses; a real zombie
      #                    does not, and the control fails if no zombie was created).
      # The predicate is the fix and it is verified both ways. `--init` is not added on top
      # because it is an untested change to how the container starts, and an untested change
      # is precisely what made this job red in the first place. It stays available if
      # zombie accumulation is ever shown to matter -- it has not been.
    steps:
      # Only git+curl, so `actions/checkout` gets a real .git (CHK-2T reads a tag) and
      # so the composite action below can fetch the ROS key. Everything else -- and in
      # particular every ROS package -- comes from .github/actions/ros-substrate, which
      # both jobs share so that neither can drift from the other again.
      - name: bootstrap (git, so checkout is a real clone)
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: git safe.directory (checkout runs as root in this container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/ros-substrate
        with:
          distro: lyrical
          ubuntu: ${{ env.BASE_CODENAME }}

      - name: build
        shell: bash
        run: |
          # ⛑ `set -u` IS OFF ACROSS THE SOURCE, ON PURPOSE, AND THIS IS NOT STYLE.
          # ROS's own setup.bash dereferences AMENT_TRACE_SETUP_FILES and COLCON_TRACE
          # unguarded. Under `set -u` sourcing it aborts the step with an unbound-variable
          # error BEFORE a single test runs -- and the step then exits 1 on a PERFECTLY
          # HEALTHY tree. Measured 2026-09-07: the first draft of this workflow did exactly
          # that, and it looked like it worked, because it was first tried on a tree with a
          # deliberately broken invariant and duly went red. A gate that reds on everything
          # satisfies 'it went red once' and measures nothing. Both directions are tested now.
          set -o pipefail
          set +u; source /opt/ros/lyrical/setup.bash; set -u
          mkdir -p /ws/src && cp -r "$GITHUB_WORKSPACE" /ws/src/hubot && cd /ws
          colcon build --packages-select hubot \
            --cmake-args -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /ws/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### build FAILED"
              echo "The compiler errors, in order:"
              echo '```'
              grep -E " (error|fatal error): " /ws/build.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # ⚑ THE TRAP THIS STEP EXISTS TO AVOID, MEASURED ON THIS PACKAGE 2026-09-07.
      # A deliberately broken SOTIF safety invariant was injected into src/
      # zone_parameter_filter.cpp. `colcon build` exited 0. `colcon test` ALSO
      # EXITED 0. Only `colcon test-result` exited 1.
      # A workflow written the obvious way — `run: colcon test` — would have gone
      # GREEN while a safety invariant was red. That is Sakichi Vision 87 verbatim:
      # "a green build that hides a failure violates Jidoka." `colcon test-result`
      # is the gate; `colcon test` is only how the tests are executed.
      - name: test — all 10 CTest targets
        shell: bash
        run: |
          # ⛑ `set -u` IS OFF ACROSS THE SOURCE, ON PURPOSE, AND THIS IS NOT STYLE.
          # ROS's own setup.bash dereferences AMENT_TRACE_SETUP_FILES and COLCON_TRACE
          # unguarded. Under `set -u` sourcing it aborts the step with an unbound-variable
          # error BEFORE a single test runs -- and the step then exits 1 on a PERFECTLY
          # HEALTHY tree. Measured 2026-09-07: the first draft of this workflow did exactly
          # that, and it looked like it worked, because it was first tried on a tree with a
          # deliberately broken invariant and duly went red. A gate that reds on everything
          # satisfies 'it went red once' and measures nothing. Both directions are tested now.
          set -o pipefail
          set +u; source /opt/ros/lyrical/setup.bash; set -u
          cd /ws
          colcon test --packages-select hubot --event-handlers console_direct+ \
            2>&1 | tail -80 || true
          set +e
          colcon test-result --verbose 2>&1 | tee /ws/test-result.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### suite"
            echo '```'
            grep -E "^Summary:" /ws/test-result.log || tail -5 /ws/test-result.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            {
              echo ""
              echo "**RED.** The failing targets and what each said:"
              echo '```'
              sed -n '/- /,$p' /ws/test-result.log | head -60
              echo '```'
              echo "The per-test XML is attached to this run as the \`suite-logs\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: |
            /ws/build.log
            /ws/test-result.log
            /ws/build/hubot/test_results/
          if-no-files-found: warn
          retention-days: 14

  # ── 2 ── the bring-up: the four cases, on released nav2, from the install space
  launch:
    name: launch falsifier (bring-up)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      # ⚑ NO `options: --init` HERE, AND THE OMISSION IS THE RULING.
      # The first CI run's launch job refused before its first case, over three zombies
      # (2x map_server, 1x nav2_costmap_2d, all <defunct>) left un-reaped because a
      # container whose PID 1 is a shell reaps no orphans. Three fixes were possible:
      #   `--init`      -- gives PID 1 a reaper. Removes the zombies, but it is a property
      #                    of HOW THE CONTAINER WAS STARTED. test/launch_gate.sh has to be
      #                    right when a contributor runs it on her laptop with no container
      #                    at all, so this cannot be the fix; at best it hides the bug here
      #                    while leaving it live for her.
      #   teardown wait -- CANNOT WORK. A process may only wait() for its own children.
      #                    The zombies are the launch file's children, reparented to PID 1
      #                    when their parent died. They were never ours to reap.
      #   the predicate -- the guard asks the wrong question. A defunct process holds no
      #                    sockets and joins no DDS graph; it cannot contaminate the count
      #                    the guard protects. Narrowed to LIVE processes, with a control
      #                    in each direction (a live survivor still refuses; a real zombie
      #                    does not, and the control fails if no zombie was created).
      # The predicate is the fix and it is verified both ways. `--init` is not added on top
      # because it is an untested change to how the container starts, and an untested change
      # is precisely what made this job red in the first place. It stays available if
      # zombie accumulation is ever shown to matter -- it has not been.
    steps:
      # Only git+curl, so `actions/checkout` gets a real .git (CHK-2T reads a tag) and
      # so the composite action below can fetch the ROS key. Everything else -- and in
      # particular every ROS package -- comes from .github/actions/ros-substrate, which
      # both jobs share so that neither can drift from the other again.
      - name: bootstrap (git, so checkout is a real clone)
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: git safe.directory (checkout runs as root in this container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/ros-substrate
        with:
          distro: lyrical
          ubuntu: ${{ env.BASE_CODENAME }}

      - name: build into an install space
        shell: bash
        run: |
          # ⛑ `set -u` IS OFF ACROSS THE SOURCE, ON PURPOSE, AND THIS IS NOT STYLE.
          # ROS's own setup.bash dereferences AMENT_TRACE_SETUP_FILES and COLCON_TRACE
          # unguarded. Under `set -u` sourcing it aborts the step with an unbound-variable
          # error BEFORE a single test runs -- and the step then exits 1 on a PERFECTLY
          # HEALTHY tree. Measured 2026-09-07: the first draft of this workflow did exactly
          # that, and it looked like it worked, because it was first tried on a tree with a
          # deliberately broken invariant and duly went red. A gate that reds on everything
          # satisfies 'it went red once' and measures nothing. Both directions are tested now.
          set -o pipefail
          set +u; source /opt/ros/lyrical/setup.bash; set -u
          mkdir -p /ws/src && cp -r "$GITHUB_WORKSPACE" /ws/src/hubot && cd /ws
          colcon build --packages-select hubot --install-base /opt/hubot \
            --build-base /ws/build --cmake-args -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /ws/build.log
          rc=${PIPESTATUS[0]}; exit "$rc"

      # ⚑ THE GATE PROVES IT CAN STILL FAIL, ON THIS PULL REQUEST, BEFORE IT IS TRUSTED
      # TO PASS. --selftest asserts a knowingly WRONG expectation on the read-only
      # overlay case and requires the gate to report DID NOT REPRODUCE. If this step
      # goes green, the launch gate below is blind and its pass means nothing.
      # ⚑ THE GUARD THAT REFUSED ON THE FIRST CI RUN NOW PROVES ITSELF, BOTH WAYS, HERE.
      # A narrowed guard is how a guard becomes a no-op. This spawns a real live process
      # (must be refused) and a real zombie (must not be), and fails if the zombie was
      # never actually created -- an untested negative half is not a passing one.
      - name: negative control — the contamination guard, both directions
        shell: bash
        run: bash /ws/src/hubot/test/launch_gate.sh . --selftest-contamination

      - name: negative control — the launch gate must be able to fail
        shell: bash
        env:
          LAUNCH_GATE_LOGS: /tmp/lg_self
        run: |
          set -uo pipefail
          bash /ws/src/hubot/test/launch_gate.sh /opt/hubot --selftest 2>&1 | tee /tmp/self.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### launch gate — negative control"
            if [ "$rc" -eq 0 ]; then echo "PASSED: the gate reported the wrong expectation it was given."
            else echo "**FAILED: the launch gate accepted a wrong expectation. It is measuring nothing.**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: launch falsifier — the four cases
        shell: bash
        env:
          LAUNCH_GATE_LOGS: /tmp/lg_real
        run: |
          set -uo pipefail
          bash /ws/src/hubot/test/launch_gate.sh /opt/hubot 2>&1 | tee /tmp/real.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### launch falsifier"
            echo '```'
            grep -E "^(-- |     (enforced|VERDICT|⚑ VERDICT)|JUDGMENT)" /tmp/real.txt || tail -20 /tmp/real.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            {
              echo ""
              echo "**RED.** What did not reproduce, and what it means:"
              echo '```'
              sed -n '/⚑ VERDICT/,$p' /tmp/real.txt | head -40
              echo '```'
              echo "Full launch logs are attached as the \`launch-logs\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-logs
          path: |
            /tmp/lg_real/
            /tmp/lg_self/
            /ws/build.log
          if-no-files-found: warn
          retention-days: 14

  # ── 3 ── the controls: prove the prose-and-tree gate's checks can each still fail
  controls:
    name: negative controls (prose + tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # This one needs no ROS at all — it reads the tree and the prose. It runs on
      # the bare runner so that a contributor who breaks only a document learns it
      # in under a minute instead of waiting for a nav2 build.
      # ⚑ WITHOUT pyyaml, CHK-7 AND CHK-9 REPORT UNVERIFIED RATHER THAN RUNNING.
      # The gate is right to degrade honestly instead of printing a pass it did not
      # earn — but an UNVERIFIED CHK-9 means nothing is checking that this very
      # workflow still declares its triggers. Install it, so the honest degradation
      # stays available for hosts that lack it and is never what CI actually does.
      - name: pyyaml, so CHK-7 and CHK-9 actually run
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml

      - name: the gate itself
        shell: bash
        run: |
          set -uo pipefail
          python3 test/prose_matches_tree.py 2>&1 | tee /tmp/prose.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### prose-and-tree gate"
            echo '```'
            cat /tmp/prose.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # ⚑ EVERY MUTATION MUST TURN EXACTLY ITS OWN CHECK RED. The count is deliberately
      # NOT written here: the gate prints its own "N/N controls" line, and a number
      # duplicated into a step name is a number that goes stale the day a control is
      # added -- this step name said "14" for the hour in which the count became 15.
      # This is the difference between "the gate ran" and "the gate can see", and it runs
      # on every pull request because a check that has silently stopped being able to
      # fail is indistinguishable from a check that passes.
      - name: negative controls (each check must still be able to fail)
        shell: bash
        run: |
          set -uo pipefail
          python3 test/prose_matches_tree.py --selftest 2>&1 | tee /tmp/controls.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### negative controls"
            echo '```'
            cat /tmp/controls.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # ── 4 ── the live stack: the harness the SOTIF liveness claim cites, built and RUN
  #
  # ⚑ WHY A FOURTH JOB AND NOT TWO MORE LINES IN `suite`.
  # `suite` gates the package a stranger installs. This gates a harness that drives
  # it from a real nav2 controller_server. Widening `suite` to build both would give
  # one red light two meanings -- "your change broke hubot" and "your change broke the
  # harness" -- and a contributor cannot act on a light that means either. It also
  # would not have worked: see the crawl note below.
  #
  # ⚑ NOTHING ABOVE THIS LINE IS TOUCHED BY THIS JOB. Measured 2026-09-07: with
  # `hubot_live_stack/` present in the tree, `rosdep install --from-paths
  # $GITHUB_WORKSPACE` still resolves the SAME 17 keys, and `colcon build
  # --packages-select hubot` builds the same one package. The two jobs above are
  # byte-identical to what they were, and their substrate does not grow.
  #
  # ⚑ THE COST, MEASURED RATHER THAN ESTIMATED. Over `suite`'s 17 resolved keys this
  # job resolves 21: the harness's own nav2_behavior_tree, nav2_controller,
  # behaviortree_cpp and nav2_regulated_pure_pursuit_controller, plus two ros2 CLI
  # verb packages it now declares because its SHIPPED script invokes them (the other
  # four verbs arrive with the tools the composite action already installs).
  #
  # ⚑ AND THE DEB NAMES ARE DELIBERATELY NOT WRITTEN ANYWHERE IN THIS FILE. CHK-10
  # greps this file for them and it is right to: a package name written here is a
  # second dependency list being born. They live in hubot_live_stack/package.xml and
  # rosdep resolves them. This comment was RED on that check until it was reworded,
  # which is the check doing its job on the person adding a job to it.
  live-stack:
    name: live stack (harness, released nav2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      # No `options: --init` here either, for the reason recorded on the jobs above.
    steps:
      - name: bootstrap (git, so checkout is a real clone)
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: git safe.directory (checkout runs as root in this container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/ros-substrate
        with:
          distro: lyrical
          ubuntu: ${{ env.BASE_CODENAME }}
          # ⚑ THIS INPUT REPLACES TWO STEPS THAT USED TO STAND HERE, AND IT IS THE
          # CLASS-FIX FOR BOTH OF THEM. `rosdep` and `colcon` stop crawling at the
          # first package.xml on a path; this repository's ROOT is a package, so the
          # harness nested inside it was invisible to `--from-paths $GITHUB_WORKSPACE`
          # and this job made a SECOND rosdep call to pick it up. That call ran AFTER
          # the action's `rm -rf /var/lib/apt/lists/*` and died on the runner in
          # 0.33 s with `E: Unable to locate package ...` -- apt's message for "I have
          # no lists", byte-identical to its message for "no such package". The fix
          # then was an `apt-get update` step here, and a second one to diagnose it.
          # The fix now is that there is no second call at all: both paths resolve in
          # ONE rosdep invocation inside the action, before the teardown. Nothing is
          # left to break and the recipe has exactly one home.
          extra-paths: hubot_live_stack

      # ⚑ THE GUARD PROVES IT CAN REFUSE BEFORE IT IS TRUSTED TO PASS.
      # The field failure here is silent: `colcon build --packages-select
      # hubot_live_stack` on this layout prints a WARNING, builds nothing, and exits
      # ZERO. This step runs exactly that and requires the guard to say NO.
      - name: negative control — the build guard must be able to fail
        shell: bash
        run: |
          set +u; source /opt/ros/lyrical/setup.bash; set -u
          mkdir -p /ws/src && cp -r "$GITHUB_WORKSPACE" /ws/src/hubot
          bash /ws/src/hubot/hubot_live_stack/scripts/build_gate.sh /ws --selftest

      - name: build — by explicit path, then assert the artifacts exist
        shell: bash
        run: |
          set +u; source /opt/ros/lyrical/setup.bash; set -u
          bash /ws/src/hubot/hubot_live_stack/scripts/build_gate.sh /ws 2>&1 | tee /ws/live_build.log
          rc=${PIPESTATUS[0]}
          {
            echo "### live-stack build"
            echo '```'
            tail -12 /ws/live_build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # ⚑ THE RUN MUST BE ABLE TO GO RED, AND PROVING IT IS NOT OPTIONAL HERE.
      # Until 2026-09-07 `run_live_stack.sh` exited 0 unconditionally -- its last
      # command was an `ls` -- so three runs in a row on released nav2 reported
      # success over a stack whose costmap never activated. It now exits non-zero
      # when a lifecycle or recovery stage fails. This step applies an overlay that
      # names a controller plugin that does not exist, which is exactly how the
      # harness really failed that day, and requires the script to REFUSE.
      - name: negative control — the run must be able to fail
        shell: bash
        run: |
          set +u; source /opt/ros/lyrical/setup.bash; source /ws/install/setup.bash; set -u
          set -uo pipefail
          S=/ws/install/hubot_live_stack/share/hubot_live_stack/scripts/run_live_stack.sh
          if bash "$S" --overlay overlay_selftest_broken_controller.yaml \
               --outdir /ws/run_selftest --hold-secs 4 > /ws/run_selftest.txt 2>&1; then
            echo "**FAILED: the harness reported success on a stack that cannot activate.**" \
              >> "$GITHUB_STEP_SUMMARY"
            tail -20 /ws/run_selftest.txt
            exit 1
          fi
          echo "PASSED: a stack that cannot activate is reported as a failure." \
            >> "$GITHUB_STEP_SUMMARY"

      # ⚑ THE POINT OF LANDING THIS PACKAGE. `doc/SOTIF_PERFORMANCE_INSUFFICIENCY.md`
      # discharges its largest liveness claim by citing a RUN of this harness. Until
      # this job existed, that run had happened once, by hand, on one machine, on an
      # image no reader can obtain. Here it happens on released nav2, on every push,
      # where anyone can read the log.
      #
      # ⚑ THE EXIT CODE IS THE VERDICT, NOT A grep OF THE OUTPUT. The first draft of
      # this step piped the run through `grep -E "configure rc|activate rc"` and took
      # the pipeline's status -- which matches `activate rc=1` just as happily as
      # `rc=0`, so a failed run would have gone green. Caught before it was committed;
      # recorded because it is the same defect as the one above, one layer up.
      - name: run — the three conditions, on released nav2
        shell: bash
        run: |
          set +u; source /opt/ros/lyrical/setup.bash; source /ws/install/setup.bash; set -u
          set -uo pipefail
          S=/ws/install/hubot_live_stack/share/hubot_live_stack/scripts/run_live_stack.sh
          rc=0
          for cond in "base:" "accepts:--overlay overlay_target_accepts.yaml" \
                      "relative:--overlay overlay_target_relative_name.yaml"; do
            name="${cond%%:*}"; args="${cond#*:}"
            echo "===== condition: $name ====="
            # shellcheck disable=SC2086
            bash "$S" $args --outdir "/ws/run_$name" --hold-secs 8 > "/ws/run_$name.txt" 2>&1 \
              || { echo "condition $name FAILED"; rc=1; }
            grep -E "configure rc|activate rc|bt_recovery rc" "/ws/run_$name.txt" || true
          done
          {
            echo "### live stack — three conditions on released nav2"
            echo '```'
            grep -H -E "configure rc|activate rc|bt_recovery rc" /ws/run_*.txt || echo "no rc lines produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            {
              echo ""
              echo "**RED.** The tail of each failing condition:"
              echo '```'
              tail -25 /ws/run_*.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stack-logs
          path: |
            /ws/live_build.log
            /ws/run_base/
            /ws/run_accepts/
            /ws/run_relative/
            /ws/run_selftest/
            /ws/run_base.txt
            /ws/run_accepts.txt
            /ws/run_relative.txt
            /ws/run_selftest.txt
          if-no-files-found: warn
          retention-days: 14

  # ── 5 ── the distro floor: the README's largest claim, EXECUTED
  #
  # ⚑ WHY THIS JOB IS NOT PART OF `suite`.
  # `suite` answers "is the package correct on the distribution we support". This
  # answers a different question -- "is the SET of distributions we claim still the
  # set that is true" -- and one red light with two meanings is a light a
  # contributor cannot act on. It is also the only job here that is expected to
  # find things RED and call that a pass.
  #
  # ⚑ AND IT IS THE ONLY GATE IN THIS FILE THAT CAN FAIL IN THE GENEROUS DIRECTION.
  # Every other check protects us from shipping something broken. This one also
  # protects a developer we will never hear from: if the port lands and the page
  # still says `jazzy` has nothing for her, she leaves, nothing reds, and the cost
  # is entirely hers. `scripts/distro_floor.py --probe` turns that silence into a
  # red light, because a resolved dependency that the declaration still calls
  # missing fails the job just as hard as a missing one it calls resolved.
  plan:
    name: distro floor plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: pyyaml, so the declaration can actually be read
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml
      # ⚑ THE MATRIX IS NOT WRITTEN HERE. It is read from
      # .github/supported_distros.yml, which is also what the README table is
      # rendered from and what the probe below asserts against. One declaration,
      # three consumers: a distribution cannot be tested-but-undocumented, or
      # documented-but-untested, because there is no second list to disagree with.
      - id: read
        name: the matrix, read from the declaration
        run: echo "matrix=$(python3 scripts/distro_floor.py --matrix)" >> "$GITHUB_OUTPUT"

  distro-floor:
    name: distro floor (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A jazzy failure must not cancel the kilted run: they are separate claims
      # and a porter needs both answers from one push.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      # ⚑ NO DIGEST IS WRITTEN HERE. `jobs.<id>.container.image` cannot read `env`,
      # which is why the three jobs above each spell the resolute digest out; it CAN
      # read `matrix`, so this one takes its base from the same declaration that
      # names the distribution. The pairing cannot drift because there is one of it.
      image: ${{ matrix.base }}
    steps:
      - name: bootstrap (git, so checkout is a real clone)
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: git safe.directory (checkout runs as root in this container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ⚑ continue-on-error IS THE ASSERTION, NOT A CONCESSION.
      # On a distribution declared `unsupported` this step is EXPECTED to fail --
      # rosdep cannot resolve the manifest -- and its outcome is read below. A job
      # that skipped the shared action here would be proving something about a
      # substrate nobody builds on; this proves it about the real one.
      - id: substrate
        continue-on-error: true
        uses: ./.github/actions/ros-substrate
        with:
          distro: ${{ matrix.name }}
          ubuntu: ${{ matrix.ubuntu }}

      - name: the floor, proved in the direction it is declared
        shell: bash
        run: |
          set -uo pipefail
          D='${{ matrix.name }}'
          STATUS='${{ matrix.status }}'
          OUTCOME='${{ steps.substrate.outcome }}'
          echo "declared: $STATUS   substrate step: $OUTCOME"

          python3 -c "import yaml" 2>/dev/null || \
            { apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-yaml; }

          if [ "$STATUS" = "supported" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "" >&2
              echo "$D is declared SUPPORTED and its substrate did not come up." >&2
              echo "Either the feed moved or the declaration is wrong. Read the" >&2
              echo "substrate step above -- it prints the versions it installed." >&2
              exit 1
            fi
          else
            # ⚑ INSTALL EVERYTHING THE DECLARATION DOES *NOT* CALL MISSING, so the
            # probe below distinguishes "this one package is absent" from "nothing
            # is installed". The skip list comes from the declaration; no ROS
            # package name is written into this workflow (see CHK-10).
            apt-get update -qq
            SKIP=$(python3 - "$D" <<'EOF'
          import sys, yaml
          d = [x for x in yaml.safe_load(open(".github/supported_distros.yml"))["distros"]
               if x["name"] == sys.argv[1]][0]
          print(" ".join(d.get("expect_missing") or []))
          EOF
            )
            echo "resolving the manifest with the declared-missing keys skipped: $SKIP"
            rosdep install --from-paths "$GITHUB_WORKSPACE" --ignore-src \
              --rosdistro "$D" -y --skip-keys "$SKIP" 2>&1 | tail -5
          fi

          # ⛑ `set -u` off across the source: ROS's setup.bash dereferences
          # AMENT_TRACE_SETUP_FILES unguarded and aborts the step on a healthy tree.
          set +u; source "/opt/ros/$D/setup.bash"; set -u

          python3 scripts/distro_floor.py --probe "$D" 2>&1 | tee /tmp/floor.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### distro floor — $D"
            echo '```'
            cat /tmp/floor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # ── 6 ── the page and the declaration say the same thing, byte for byte
  #
  # Its own job, and deliberately not folded into `plan`: a drifted README must not
  # skip the probes above. A contributor gets one red for the prose and a separate
  # red per distribution, and can act on each.
  floor-docs:
    name: distro floor docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: pyyaml, so the declaration can actually be read
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml
      - name: README's floor table is rendered from the declaration, not typed
        run: python3 scripts/distro_floor.py --check
