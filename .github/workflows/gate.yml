# ══════════════════════════════════════════════════════════════════════════════
# hubot — the gate a contributor gets for free.
#
# WHY THIS FILE EXISTS. Until it did, every green result this package had ever
# produced happened because someone on the maintaining side chose to run it by
# hand. That put "is this right?" on the person opening the pull request, or on
# us reading it afterwards. It is the machine's job. The stranger who opens the
# first PR against this package should learn what she broke from the run, before
# anyone here has looked at it.
#
# WHAT IT RUNS: the same things that were being run by hand — the full CTest
# suite against RELEASED nav2, the prose-and-tree gate, the static safety
# invariants, and the launch-side bring-up falsifier.
#
# ⚑ AND IT RUNS THE GATES' OWN NEGATIVE CONTROLS ON EVERY PULL REQUEST.
# A gate that has never failed has measured nothing, so `controls` proves — on
# your PR, not on some past afternoon — that each check can still go red.
# ══════════════════════════════════════════════════════════════════════════════
name: gate

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege. Nothing here writes to the repository, and nothing here needs
# a secret — see the `secrets` note in the substrate step.
permissions:
  contents: read

# A newer push supersedes an older run on the same ref. The contributor waits for
# her latest commit, not for a queue behind it.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ⚑ THE SUBSTRATE, PINNED BY DIGEST. ubuntu:26.04 == "resolute", the distribution
  # the released ROS "lyrical" nav2 debs are built for. A tag can move; a digest
  # cannot, and a build whose base moved silently is not a reproduction.
  BASE_IMAGE: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b

jobs:
  # ── 1 ── the suite: build against RELEASED nav2 and run all ten CTest targets
  suite:
    name: suite (released nav2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      # ⚑ NO `options: --init` HERE, AND THE OMISSION IS THE RULING.
      # The first CI run's launch job refused before its first case, over three zombies
      # (2x map_server, 1x nav2_costmap_2d, all <defunct>) left un-reaped because a
      # container whose PID 1 is a shell reaps no orphans. Three fixes were possible:
      #   `--init`      -- gives PID 1 a reaper. Removes the zombies, but it is a property
      #                    of HOW THE CONTAINER WAS STARTED. test/launch_gate.sh has to be
      #                    right when a contributor runs it on her laptop with no container
      #                    at all, so this cannot be the fix; at best it hides the bug here
      #                    while leaving it live for her.
      #   teardown wait -- CANNOT WORK. A process may only wait() for its own children.
      #                    The zombies are the launch file's children, reparented to PID 1
      #                    when their parent died. They were never ours to reap.
      #   the predicate -- the guard asks the wrong question. A defunct process holds no
      #                    sockets and joins no DDS graph; it cannot contaminate the count
      #                    the guard protects. Narrowed to LIVE processes, with a control
      #                    in each direction (a live survivor still refuses; a real zombie
      #                    does not, and the control fails if no zombie was created).
      # The predicate is the fix and it is verified both ways. `--init` is not added on top
      # because it is an untested change to how the container starts, and an untested change
      # is precisely what made this job red in the first place. It stays available if
      # zombie accumulation is ever shown to matter -- it has not been.
    steps:
      # Only git+curl, so `actions/checkout` gets a real .git (CHK-2T reads a tag) and
      # so the composite action below can fetch the ROS key. Everything else -- and in
      # particular every ROS package -- comes from .github/actions/ros-substrate, which
      # both jobs share so that neither can drift from the other again.
      - name: bootstrap (git, so checkout is a real clone)
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: git safe.directory (checkout runs as root in this container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/ros-substrate

      - name: build
        shell: bash
        run: |
          # ⛑ `set -u` IS OFF ACROSS THE SOURCE, ON PURPOSE, AND THIS IS NOT STYLE.
          # ROS's own setup.bash dereferences AMENT_TRACE_SETUP_FILES and COLCON_TRACE
          # unguarded. Under `set -u` sourcing it aborts the step with an unbound-variable
          # error BEFORE a single test runs -- and the step then exits 1 on a PERFECTLY
          # HEALTHY tree. Measured 2026-09-07: the first draft of this workflow did exactly
          # that, and it looked like it worked, because it was first tried on a tree with a
          # deliberately broken invariant and duly went red. A gate that reds on everything
          # satisfies 'it went red once' and measures nothing. Both directions are tested now.
          set -o pipefail
          set +u; source /opt/ros/lyrical/setup.bash; set -u
          mkdir -p /ws/src && cp -r "$GITHUB_WORKSPACE" /ws/src/hubot && cd /ws
          colcon build --packages-select hubot \
            --cmake-args -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /ws/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### build FAILED"
              echo "The compiler errors, in order:"
              echo '```'
              grep -E " (error|fatal error): " /ws/build.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # ⚑ THE TRAP THIS STEP EXISTS TO AVOID, MEASURED ON THIS PACKAGE 2026-09-07.
      # A deliberately broken SOTIF safety invariant was injected into src/
      # zone_parameter_filter.cpp. `colcon build` exited 0. `colcon test` ALSO
      # EXITED 0. Only `colcon test-result` exited 1.
      # A workflow written the obvious way — `run: colcon test` — would have gone
      # GREEN while a safety invariant was red. That is Sakichi Vision 87 verbatim:
      # "a green build that hides a failure violates Jidoka." `colcon test-result`
      # is the gate; `colcon test` is only how the tests are executed.
      - name: test — all 10 CTest targets
        shell: bash
        run: |
          # ⛑ `set -u` IS OFF ACROSS THE SOURCE, ON PURPOSE, AND THIS IS NOT STYLE.
          # ROS's own setup.bash dereferences AMENT_TRACE_SETUP_FILES and COLCON_TRACE
          # unguarded. Under `set -u` sourcing it aborts the step with an unbound-variable
          # error BEFORE a single test runs -- and the step then exits 1 on a PERFECTLY
          # HEALTHY tree. Measured 2026-09-07: the first draft of this workflow did exactly
          # that, and it looked like it worked, because it was first tried on a tree with a
          # deliberately broken invariant and duly went red. A gate that reds on everything
          # satisfies 'it went red once' and measures nothing. Both directions are tested now.
          set -o pipefail
          set +u; source /opt/ros/lyrical/setup.bash; set -u
          cd /ws
          colcon test --packages-select hubot --event-handlers console_direct+ \
            2>&1 | tail -80 || true
          set +e
          colcon test-result --verbose 2>&1 | tee /ws/test-result.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### suite"
            echo '```'
            grep -E "^Summary:" /ws/test-result.log || tail -5 /ws/test-result.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            {
              echo ""
              echo "**RED.** The failing targets and what each said:"
              echo '```'
              sed -n '/- /,$p' /ws/test-result.log | head -60
              echo '```'
              echo "The per-test XML is attached to this run as the \`suite-logs\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: |
            /ws/build.log
            /ws/test-result.log
            /ws/build/hubot/test_results/
          if-no-files-found: warn
          retention-days: 14

  # ── 2 ── the bring-up: the four cases, on released nav2, from the install space
  launch:
    name: launch falsifier (bring-up)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      # ⚑ NO `options: --init` HERE, AND THE OMISSION IS THE RULING.
      # The first CI run's launch job refused before its first case, over three zombies
      # (2x map_server, 1x nav2_costmap_2d, all <defunct>) left un-reaped because a
      # container whose PID 1 is a shell reaps no orphans. Three fixes were possible:
      #   `--init`      -- gives PID 1 a reaper. Removes the zombies, but it is a property
      #                    of HOW THE CONTAINER WAS STARTED. test/launch_gate.sh has to be
      #                    right when a contributor runs it on her laptop with no container
      #                    at all, so this cannot be the fix; at best it hides the bug here
      #                    while leaving it live for her.
      #   teardown wait -- CANNOT WORK. A process may only wait() for its own children.
      #                    The zombies are the launch file's children, reparented to PID 1
      #                    when their parent died. They were never ours to reap.
      #   the predicate -- the guard asks the wrong question. A defunct process holds no
      #                    sockets and joins no DDS graph; it cannot contaminate the count
      #                    the guard protects. Narrowed to LIVE processes, with a control
      #                    in each direction (a live survivor still refuses; a real zombie
      #                    does not, and the control fails if no zombie was created).
      # The predicate is the fix and it is verified both ways. `--init` is not added on top
      # because it is an untested change to how the container starts, and an untested change
      # is precisely what made this job red in the first place. It stays available if
      # zombie accumulation is ever shown to matter -- it has not been.
    steps:
      # Only git+curl, so `actions/checkout` gets a real .git (CHK-2T reads a tag) and
      # so the composite action below can fetch the ROS key. Everything else -- and in
      # particular every ROS package -- comes from .github/actions/ros-substrate, which
      # both jobs share so that neither can drift from the other again.
      - name: bootstrap (git, so checkout is a real clone)
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: git safe.directory (checkout runs as root in this container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/ros-substrate

      - name: build into an install space
        shell: bash
        run: |
          # ⛑ `set -u` IS OFF ACROSS THE SOURCE, ON PURPOSE, AND THIS IS NOT STYLE.
          # ROS's own setup.bash dereferences AMENT_TRACE_SETUP_FILES and COLCON_TRACE
          # unguarded. Under `set -u` sourcing it aborts the step with an unbound-variable
          # error BEFORE a single test runs -- and the step then exits 1 on a PERFECTLY
          # HEALTHY tree. Measured 2026-09-07: the first draft of this workflow did exactly
          # that, and it looked like it worked, because it was first tried on a tree with a
          # deliberately broken invariant and duly went red. A gate that reds on everything
          # satisfies 'it went red once' and measures nothing. Both directions are tested now.
          set -o pipefail
          set +u; source /opt/ros/lyrical/setup.bash; set -u
          mkdir -p /ws/src && cp -r "$GITHUB_WORKSPACE" /ws/src/hubot && cd /ws
          colcon build --packages-select hubot --install-base /opt/hubot \
            --build-base /ws/build --cmake-args -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /ws/build.log
          rc=${PIPESTATUS[0]}; exit "$rc"

      # ⚑ THE GATE PROVES IT CAN STILL FAIL, ON THIS PULL REQUEST, BEFORE IT IS TRUSTED
      # TO PASS. --selftest asserts a knowingly WRONG expectation on the read-only
      # overlay case and requires the gate to report DID NOT REPRODUCE. If this step
      # goes green, the launch gate below is blind and its pass means nothing.
      # ⚑ THE GUARD THAT REFUSED ON THE FIRST CI RUN NOW PROVES ITSELF, BOTH WAYS, HERE.
      # A narrowed guard is how a guard becomes a no-op. This spawns a real live process
      # (must be refused) and a real zombie (must not be), and fails if the zombie was
      # never actually created -- an untested negative half is not a passing one.
      - name: negative control — the contamination guard, both directions
        shell: bash
        run: bash /ws/src/hubot/test/launch_gate.sh . --selftest-contamination

      - name: negative control — the launch gate must be able to fail
        shell: bash
        env:
          LAUNCH_GATE_LOGS: /tmp/lg_self
        run: |
          set -uo pipefail
          bash /ws/src/hubot/test/launch_gate.sh /opt/hubot --selftest 2>&1 | tee /tmp/self.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### launch gate — negative control"
            if [ "$rc" -eq 0 ]; then echo "PASSED: the gate reported the wrong expectation it was given."
            else echo "**FAILED: the launch gate accepted a wrong expectation. It is measuring nothing.**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: launch falsifier — the four cases
        shell: bash
        env:
          LAUNCH_GATE_LOGS: /tmp/lg_real
        run: |
          set -uo pipefail
          bash /ws/src/hubot/test/launch_gate.sh /opt/hubot 2>&1 | tee /tmp/real.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### launch falsifier"
            echo '```'
            grep -E "^(-- |     (enforced|VERDICT|⚑ VERDICT)|JUDGMENT)" /tmp/real.txt || tail -20 /tmp/real.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            {
              echo ""
              echo "**RED.** What did not reproduce, and what it means:"
              echo '```'
              sed -n '/⚑ VERDICT/,$p' /tmp/real.txt | head -40
              echo '```'
              echo "Full launch logs are attached as the \`launch-logs\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-logs
          path: |
            /tmp/lg_real/
            /tmp/lg_self/
            /ws/build.log
          if-no-files-found: warn
          retention-days: 14

  # ── 3 ── the controls: prove the prose-and-tree gate's checks can each still fail
  controls:
    name: negative controls (prose + tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # This one needs no ROS at all — it reads the tree and the prose. It runs on
      # the bare runner so that a contributor who breaks only a document learns it
      # in under a minute instead of waiting for a nav2 build.
      # ⚑ WITHOUT pyyaml, CHK-7 AND CHK-9 REPORT UNVERIFIED RATHER THAN RUNNING.
      # The gate is right to degrade honestly instead of printing a pass it did not
      # earn — but an UNVERIFIED CHK-9 means nothing is checking that this very
      # workflow still declares its triggers. Install it, so the honest degradation
      # stays available for hosts that lack it and is never what CI actually does.
      - name: pyyaml, so CHK-7 and CHK-9 actually run
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml

      - name: the gate itself
        shell: bash
        run: |
          set -uo pipefail
          python3 test/prose_matches_tree.py 2>&1 | tee /tmp/prose.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### prose-and-tree gate"
            echo '```'
            cat /tmp/prose.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # ⚑ EVERY MUTATION MUST TURN EXACTLY ITS OWN CHECK RED. The count is deliberately
      # NOT written here: the gate prints its own "N/N controls" line, and a number
      # duplicated into a step name is a number that goes stale the day a control is
      # added -- this step name said "14" for the hour in which the count became 15.
      # This is the difference between "the gate ran" and "the gate can see", and it runs
      # on every pull request because a check that has silently stopped being able to
      # fail is indistinguishable from a check that passes.
      - name: negative controls (each check must still be able to fail)
        shell: bash
        run: |
          set -uo pipefail
          python3 test/prose_matches_tree.py --selftest 2>&1 | tee /tmp/controls.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### negative controls"
            echo '```'
            cat /tmp/controls.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
